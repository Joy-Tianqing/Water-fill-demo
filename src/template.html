<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ece9e1">
  <meta name="description" content="满一点：透明试接，再凭感觉挑战不透明杯。">
  <title>满一点 — 单关验证</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece9e1;color:#46524c}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    .masthead{position:fixed;z-index:2;top:max(28px,env(safe-area-inset-top));left:clamp(22px,5vw,70px);pointer-events:none}
    .kicker{margin:0 0 11px;font-size:9px;letter-spacing:.28em;color:#8b928b}.masthead h1{margin:0;font-size:clamp(19px,2.2vw,27px);font-weight:400;letter-spacing:.12em}
    .edition{position:fixed;z-index:2;top:max(31px,env(safe-area-inset-top));right:clamp(22px,5vw,70px);font-size:9px;letter-spacing:.14em;color:#8b928b}
    .controls{position:fixed;z-index:3;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:13px;width:min(420px,calc(100% - 28px))}
    #status{margin:0;font-size:11px;letter-spacing:.05em;color:#68766e;text-align:center}.row{display:flex;gap:10px}
    button{appearance:none;border:1px solid rgba(65,82,72,.17);border-radius:999px;min-height:52px;padding:0 22px;background:rgba(248,248,241,.72);color:#46564d;font:500 12px/1 inherit;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(13px);box-shadow:0 4px 14px rgba(45,62,50,.05);touch-action:manipulation}
    button.primary{min-width:150px;color:#f5f6ef;background:#4b6355;border-color:#4b6355}button:disabled{opacity:.55;cursor:default}button:active:not(:disabled){transform:scale(.97)}button:focus-visible{outline:2px solid #5b7864;outline-offset:4px}
    @media(max-height:520px){.masthead{top:18px}.edition{top:20px}.controls{bottom:12px;gap:8px}button{min-height:44px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <canvas id="scene" aria-label="水龙头向透明玻璃杯注水的动画"></canvas>
  <header class="masthead"><p class="kicker">WATER FILL / 001</p><h1>先看见，再凭感觉</h1></header>
  <div class="edition">M0 · 第 1 关</div>
  <div class="controls" role="group" aria-label="水龙头控制">
    <p id="status" role="status" aria-live="polite">点击开关，开始接水。</p>
    <div id="result" role="status" style="font-size:42px;min-height:50px"></div><div class="row"><button id="toggle" class="primary" type="button">开始流水</button><button id="reset" type="button">刷新清空</button></div>
  </div>
  <noscript>请启用 JavaScript 以使用接水演示。</noscript>
  <script>
/* CORE */
  (()=>{
    const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),toggle=document.querySelector('#toggle'),reset=document.querySelector('#reset'),status=document.querySelector('#status');
    const STEP=1/120;let dpr=1,w=0,h=0,fill=0,emitted=0,source=0,time=0,last=0,acc=0,packets=[],ripples=[];
    const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),mix=(a,b,t)=>a+(b-a)*t;
    function layout(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
    function geometry(){const s=Math.min(w/430,h/700),cx=w/2,base=Math.min(h*.77,h-145),glassW=190*s,glassH=245*s;return{s,cx,base,glassW,glassH,left:cx-glassW/2,top:base-glassH,nozzleY:Math.max(130*s,glassH*.1),nozzleX:cx+8*s}}
    let suppressClick=false;
    let attempt=new WaterAttempt(),stage='trial',phase='ready',learned=false,origin=0,readyUntil=0,resultAt=0;
    const resultEl=document.querySelector('#result');
    function fresh(next=stage){stage=next;phase='ready';attempt=new WaterAttempt();fill=emitted=source=time=acc=0;packets=[];ripples=[];resultEl.textContent='';sync();draw()}
    function start(){phase='preparing';readyUntil=performance.now()+600;origin=readyUntil;last=performance.now();sync()}
    function update(now){
      if(phase==='preparing' && now>=readyUntil)phase='running';
      if(phase!=='running'&&phase!=='closing')return;
      attempt.advance(Math.max(0,Math.round((now-origin)*1000)));
      time=attempt.t/1000000;fill=attempt.volume/1000000;emitted=attempt.emitted/1000000;
      source=attempt.closeTime===null?Math.min(1,attempt.t/60000):Math.max(0,1-(attempt.t-attempt.closeTime)/80000);
      packets=attempt.packets.map(p=>({t:(p.t-108000)/1000000,v:p.v/1000000}));
      if(attempt.closeTime!==null)phase='closing';
      if(attempt.result){phase='review';resultAt=now;if(stage==='trial')learned=true;
        resultEl.textContent=stage==='trial'?(attempt.spilled?'溢出了':(fill*100).toFixed(1)+'%'):attempt.result.grade;
      }
      sync();
    }
    function sync(){
      const busy=phase==='preparing'||phase==='closing';toggle.disabled=busy;
      toggle.textContent=phase==='ready'?(stage==='trial'?'开始透明试接':'开始正式挑战'):phase==='preparing'?'准备接水…':phase==='running'?'关水':phase==='closing'?'余水落下中…':'再试一次';
      reset.disabled=phase!=='review'&&phase!=='ready';
      reset.hidden=stage==='trial'&&!learned;
      reset.textContent=stage==='trial'?'进入正式挑战':'返回透明试接';
      status.textContent=phase==='ready'?(stage==='trial'?'观察水位，只能关水一次。':'杯内不可见，凭试接的感觉关水。'):phase==='preparing'?'准备好，即将出水。':phase==='running'?'点击杯子或按钮关水。':phase==='closing'?'已关水，等待最后的水落下。':phase==='interrupted'?'本轮已中断，不评级。点击重新开始。':stage==='trial'?'记住这次节奏，再试或进入正式挑战。':attempt.result.grade==='F'?'溢出了，再试一次。':'挑战完成，可重试或返回试接。';
      canvas.setAttribute('aria-label',stage==='trial'?'透明杯接水场景':'不透明杯接水场景');
    }
    function close(now){if(phase!=='running')return;attempt.close(Math.max(0,Math.round((now-origin)*1000)));phase='closing';update(now)}
    function rounded(x,y,W,H,r){ctx.beginPath();ctx.roundRect(x,y,W,H,r)}
    function draw(){const g=geometry(),{s,cx,base,glassW,glassH,left,top,nozzleX,nozzleY}=g;ctx.clearRect(0,0,w,h);const bg=ctx.createRadialGradient(cx,h*.48,20,cx,h*.48,Math.max(w,h)*.7);bg.addColorStop(0,'#f8f7f0');bg.addColorStop(1,'#dfddd5');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
      ctx.save();ctx.shadowColor='rgba(45,52,45,.18)';ctx.shadowBlur=18*s;ctx.shadowOffsetY=12*s;ctx.fillStyle='rgba(91,99,91,.12)';ctx.beginPath();ctx.ellipse(cx,base+14*s,glassW*.62,16*s,0,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.save();ctx.strokeStyle='#68736e';ctx.lineWidth=16*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(nozzleX-115*s,nozzleY-72*s);ctx.lineTo(nozzleX-25*s,nozzleY-72*s);ctx.quadraticCurveTo(nozzleX+6*s,nozzleY-72*s,nozzleX+6*s,nozzleY-38*s);ctx.lineTo(nozzleX+6*s,nozzleY);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3*s;ctx.stroke();
      ctx.fillStyle='#56635c';rounded(nozzleX-45*s,nozzleY-91*s,56*s,11*s,5*s);ctx.fill();ctx.restore();
      if(packets.length){ctx.save();ctx.lineCap='round';for(const p of packets){const age=Math.max(0,time-p.t),end=stage==='formal'?top:base-10*s-fill*(glassH-24*s),progress=Math.min(1,age/.108),y=nozzleY+(end-nozzleY)*progress;ctx.strokeStyle='rgba(112,190,215,.72)';ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(nozzleX,Math.max(nozzleY,y-18*s));ctx.lineTo(nozzleX,y);ctx.stroke()}ctx.restore()}
      ctx.save();rounded(left,top,glassW,glassH,20*s);ctx.clip();if(fill>0 && stage==='trial'){const waterH=fill*(glassH-24*s),y=base-10*s-waterH,grad=ctx.createLinearGradient(0,y,0,base);grad.addColorStop(0,'rgba(113,201,226,.60)');grad.addColorStop(1,'rgba(65,150,190,.36)');ctx.fillStyle=grad;ctx.fillRect(left+7*s,y,glassW-14*s,waterH+4*s);ctx.strokeStyle='rgba(220,251,255,.8)';ctx.lineWidth=2*s;ctx.beginPath();for(let x=left+6*s;x<=left+glassW-6*s;x+=3){const age=time-(ripples.at(-1)?.t||0),amp=5*s*Math.exp(-age*2.4);const yy=y+Math.sin((x-left)*.08+age*10)*amp;ctx.lineTo(x,yy)}ctx.stroke()}ctx.restore();
      if(attempt.spilled>0){ctx.strokeStyle='rgba(87,169,194,.75)';ctx.lineWidth=4*s;for(const x of [left-3*s,left+glassW+3*s]){ctx.beginPath();ctx.moveTo(x,top+5*s);ctx.lineTo(x,base);ctx.stroke()}}
      const glass=ctx.createLinearGradient(left,0,left+glassW,0);glass.addColorStop(0,'rgba(255,255,255,.68)');glass.addColorStop(.18,'rgba(255,255,255,.08)');glass.addColorStop(.75,'rgba(150,184,187,.08)');glass.addColorStop(1,'rgba(255,255,255,.65)');ctx.fillStyle=stage==='formal'?'#506359':glass;rounded(left,top,glassW,glassH,20*s);ctx.fill();ctx.strokeStyle='rgba(116,146,145,.48)';ctx.lineWidth=2*s;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(left+18*s,top+20*s);ctx.lineTo(left+18*s,base-35*s);ctx.stroke();ctx.beginPath();ctx.ellipse(cx,top+5*s,glassW*.47,9*s,0,0,Math.PI*2);ctx.stroke();
    }
    function frame(now){requestAnimationFrame(frame);if(last && now-last>250 && ['running','closing','preparing'].includes(phase)){phase='interrupted';source=0;packets=[];sync()}last=now;update(now);draw()}
    function activate(){const now=performance.now();if(phase==='ready')start();else if(phase==='running')close(now);else if(phase==='interrupted'||(phase==='review'&&now-resultAt>=250))fresh()}
    toggle.addEventListener('pointerdown',e=>{suppressClick=false;if(e.isPrimary&&e.button===0&&phase==='running'){e.preventDefault();suppressClick=true;close(performance.now())}});
    toggle.addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}if(phase==='closing')return;activate()});
    toggle.addEventListener('keydown',e=>{if(!e.repeat)suppressClick=false;if(e.repeat){e.preventDefault();return}if((e.key===' '||e.key==='Enter')&&phase==='running'){e.preventDefault();suppressClick=true;close(performance.now())}});
    canvas.addEventListener('pointerdown',e=>{if(e.isPrimary&&e.button===0)close(performance.now())});
    reset.addEventListener('click',()=>{if((phase==='ready'||phase==='review')&&performance.now()-resultAt>=250)fresh(stage==='trial'?'formal':'trial')});
    addEventListener('resize',layout,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['preparing','running','closing'].includes(phase)){phase='interrupted';source=0;packets=[];sync()}last=performance.now()});
    layout();sync();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
